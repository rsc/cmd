{{template "head" .}}
<main class="changes">
  <div class="pagehead">
    <h1>Changes to review</h1>
  </div>

  {{/* The list arrives on its own, once every repository has been asked
       what is pending in it. */}}
  <div id="allchanges" hx-get="/f/changes" hx-trigger="load" hx-swap="outerHTML">
    <p class="empty">Reading the repositories…</p>
  </div>

  <section class="repolist">
    <h2>Repositories</h2>
    {{template "repolist" .}}
  </section>
</main>
{{template "foot" .}}
